.weather-info { 
margin-top: 25px;

} 

.sun-icon { 
font-size: 64px; 
animation: spin 20s linear infinite, breeze 3s ease-in-out infinite alternate; 
display: inline-block; 
} 

@keyframes spin { 
100% { 
transform: rotate(360deg); 
} 
} 

@keyframes breeze { 
0% { 
transform: translateX(-10px) rotate(0deg); 
} 

100% { 
transform: translateX(10px) rotate(15deg); 
} 
} 

.falling-item { 
position: absolute; 
top: -100px; 
font-size: 40px; 
z-index: 1; 
pointer-events: none; 
animation: fall linear forwards; 
} 

@keyframes fall { 
to { 
transform: translateY(120vh) rotate(360deg); 
} 
} 
</style>
